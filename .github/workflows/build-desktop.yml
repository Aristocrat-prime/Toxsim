name: Build Windows desktop console

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - integration/desktop-data-reviewer

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          python -m pip install -e . --no-deps
      - name: Run audit tests
        run: python -m pytest -q
      - name: Build desktop executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Toxsim-Data-Review
          --add-data "pubchem_cache.json;."
          --paths src
          src/toxsim/__main__.py
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Toxsim-Data-Review-Windows
          path: dist/Toxsim-Data-Review.exe
          if-no-files-found: error
          retention-days: 30
